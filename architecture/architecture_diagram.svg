      <text x="65" y="22" fill="#94a3b8" font-size="10" text-anchor="middle">Append-only Parquet</text>
      <text x="65" y="40" fill="#64748b" font-size="9" text-anchor="middle">Partitioned by Day</text>
      <text x="65" y="55" fill="#64748b" font-size="9" text-anchor="middle">72-hr Sliding Recompute</text>
    </g>
  </g>

