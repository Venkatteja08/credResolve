      <text x="70" y="20" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Entity Resolution</text>
      <text x="70" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">agent_id → employee_code</text>
      <text x="70" y="48" fill="#34d399" font-size="8" text-anchor="middle">Resolves 1,099 Canonical Reps</text>
    </g>
    <g transform="translate(15, 270)">
      <rect width="140" height="55" rx="6" fill="#1e293b" stroke="#10b981"/>
      <text x="70" y="20" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Phantom Disp Filter</text>
      <text x="70" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">Isolate Answered Dispositions</text>
      <text x="70" y="48" fill="#34d399" font-size="8" text-anchor="middle">Filters 79.9% Unanswered PTPs</text>
