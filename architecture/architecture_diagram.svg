  </g>

  <!-- Connective Arrows -->
  <path d="M 200 320 L 230 320" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 390 320 L 420 320" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 590 320 L 620 320" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 790 320 L 820 320" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 980 320 L 1010 320" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>

  <!-- Footer Stats -->
  <rect x="40" y="555" width="1120" height="115" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="585" fill="#f8fafc" font-size="14" font-weight="700">Production Guarantees &amp; Operating Service Level Agreements (SLAs)</text>
  
  <g transform="translate(60, 605)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
    <text x="20" y="10" fill="#cbd5e1" font-size="12"><tspan font-weight="700">Idempotent Settlement:</tspan> 100% duplicate transaction suppression on payment_reference.</text>
  </g>
  <g transform="translate(60, 630)">
    <circle cx="6" cy="6" r="4" fill="#10b981"/>
    <text x="20" y="10" fill="#cbd5e1" font-size="12"><tspan font-weight="700">Timezone Guarantee:</tspan> All timestamps auto-converted to Asia/Kolkata (IST); alerts on naive UTC.</text>
  </g>
  <g transform="translate(560, 605)">
    <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
    <text x="20" y="10" fill="#cbd5e1" font-size="12"><tspan font-weight="700">Calendar Normalization:</tspan> C-suite dashboards default to Daily Run Rate (Cash / Days).</text>
  </g>
  <g transform="translate(560, 630)">
    <circle cx="6" cy="6" r="4" fill="#ec4899"/>
    <text x="20" y="10" fill="#cbd5e1" font-size="12"><tspan font-weight="700">Targeting Yield:</tspan> Recommends deploying ₹10 Cr into ML Propensity Scoring (+₹34.8 Cr incremental).</text>
