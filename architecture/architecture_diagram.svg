      <text x="65" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">Net Cash / Days</text>
      <text x="65" y="48" fill="#f472b6" font-size="8" text-anchor="middle">Neutralizes Feb/Mar Flaw</text>
    </g>
    <g transform="translate(15, 130)">
      <rect width="130" height="55" rx="6" fill="#1e293b" stroke="#ec4899"/>
      <text x="65" y="20" fill="#fbcfe8" font-size="10" font-weight="700" text-anchor="middle">Attribution Window</text>
      <text x="65" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">Tight 7-Day Window</text>
      <text x="65" y="48" fill="#f472b6" font-size="8" text-anchor="middle">Eliminates Phantom Claims</text>
    </g>
    <g transform="translate(15, 200)">
      <rect width="130" height="55" rx="6" fill="#1e293b" stroke="#ec4899"/>
      <text x="65" y="20" fill="#fbcfe8" font-size="10" font-weight="700" text-anchor="middle">Unit Economics</text>
      <text x="65" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">Cost per ₹ Recovered</text>
