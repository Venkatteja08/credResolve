      <text x="65" y="20" fill="#fbcfe8" font-size="10" font-weight="700" text-anchor="middle">ML Feature Store</text>
      <text x="65" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">Propensity Model (₹10Cr)</text>
      <text x="65" y="48" fill="#f472b6" font-size="8" text-anchor="middle">Timing &amp; Channel Fit</text>
      <text x="65" y="58" fill="#34d399" font-size="8" text-anchor="middle">+₹34.8 Cr Expected Lift</text>
    </g>
    <g transform="translate(15, 350)">
      <rect width="130" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="25" fill="#cbd5e1" font-size="10" text-anchor="middle">Anomaly Watchdog</text>
