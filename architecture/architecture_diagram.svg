<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="55" fill="#f8fafc" font-size="20" font-weight="700">Production Collections Analytics Engine — Enterprise Architecture</text>
  <text x="60" y="75" fill="#94a3b8" font-size="13">End-to-End Medallion Lakehouse: Ingestion → Contracts → Clean → Golden → Metrics → Decision Dashboard</text>

  <!-- Flow Steps -->
  <!-- STEP 1: INGESTION -->
  <g transform="translate(40, 110)">
    <rect width="160" height="420" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="40" rx="10" fill="#0284c7"/>
    <text x="80" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1. RAW SOURCES</text>
    
    <g transform="translate(15, 60)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="27" fill="#e2e8f0" font-size="11" text-anchor="middle">Core Banking / LMS</text>
    </g>
    <g transform="translate(15, 120)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="22" fill="#e2e8f0" font-size="11" text-anchor="middle">Telephony PBX</text>
      <text x="65" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">Airtel / Twilio / Exotel</text>
    </g>
    <g transform="translate(15, 180)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="22" fill="#e2e8f0" font-size="11" text-anchor="middle">Digital Gateways</text>
      <text x="65" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">WhatsApp / SMS BSP</text>
    </g>
    <g transform="translate(15, 240)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="27" fill="#e2e8f0" font-size="11" text-anchor="middle">Field Collection App</text>
    </g>
    <g transform="translate(15, 300)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="22" fill="#e2e8f0" font-size="11" text-anchor="middle">Payment Gateways</text>
      <text x="65" y="37" fill="#94a3b8" font-size="9" text-anchor="middle">UPI / Cards / NACH</text>
    </g>
    <g transform="translate(15, 360)">
