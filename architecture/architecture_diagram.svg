      <text x="65" y="22" fill="#e0e7ff" font-size="11" font-weight="600" text-anchor="middle">Data Contracts Gate</text>
      <text x="65" y="38" fill="#a5b4fc" font-size="9" text-anchor="middle">JSON Schema / Great Exp</text>
      <text x="65" y="50" fill="#f43f5e" font-size="8" text-anchor="middle">Quarantine &amp; DLQ on Fail</text>
    </g>
    <g transform="translate(15, 140)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="27" fill="#cbd5e1" font-size="11" text-anchor="middle">stg_payments (Raw)</text>
    </g>
    <g transform="translate(15, 200)">
      <rect width="130" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="27" fill="#cbd5e1" font-size="11" text-anchor="middle">stg_calls (CDRs)</text>
