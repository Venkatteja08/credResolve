    <rect width="170" height="40" rx="10" fill="url(#greenGrad)"/>
    <text x="85" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3. SILVER (CLEAN)</text>
    
    <g transform="translate(15, 60)">
