      <text x="70" y="20" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">fact_omnichannel</text>
      <text x="70" y="35" fill="#cbd5e1" font-size="9" text-anchor="middle">Voice, WhatsApp, SMS, Field</text>
