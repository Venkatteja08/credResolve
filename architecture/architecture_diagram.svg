      <text x="65" y="42" fill="#e2e8f0" font-size="9" text-anchor="middle">Single-Screen View</text>
      <text x="65" y="58" fill="#e2e8f0" font-size="9" text-anchor="middle">Understood in &lt;60s</text>
      <text x="65" y="74" fill="#38bdf8" font-size="9" text-anchor="middle">Decision-Optimized</text>
      <text x="65" y="88" fill="#34d399" font-size="8" text-anchor="middle">₹10 Cr Capital Planner</text>
    </g>
    <g transform="translate(10, 175)">
      <rect width="130" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="22" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Ops Command</text>
      <text x="65" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">Dialer Pace &amp; Trunks</text>
      <text x="65" y="54" fill="#94a3b8" font-size="9" text-anchor="middle">Agent Live Performance</text>
    </g>
    <g transform="translate(10, 260)">
      <rect width="130" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="65" y="22" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Automated Alerts</text>
      <text x="65" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">Slack / PagerDuty</text>
      <text x="65" y="54" fill="#f43f5e" font-size="9" text-anchor="middle">Triggers on &gt;2.5σ Shift</text>
