  </g>

  <!-- STEP 6: SERVING & DECISIONS -->
  <g transform="translate(1010, 110)">
    <rect width="150" height="420" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="150" height="40" rx="10" fill="url(#accentGrad)"/>
    <text x="75" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">6. C-SUITE SERVING</text>
    
