      <text x="70" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">UTC/Dubai → Asia/Kolkata</text>
      <text x="70" y="48" fill="#34d399" font-size="8" text-anchor="middle">Aligns 80% Misclassified IST</text>
