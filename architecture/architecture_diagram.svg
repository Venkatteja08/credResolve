      <text x="70" y="20" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Payment Deduplication</text>
      <text x="70" y="35" fill="#e2e8f0" font-size="9" text-anchor="middle">1 SUCCESS per Txn Ref</text>
      <text x="70" y="48" fill="#34d399" font-size="8" text-anchor="middle">Saves ₹17.19 Cr Double-Count</text>
    </g>
    <g transform="translate(15, 130)">
